<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4535">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Pressure · אב טיפוס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* צבעים מ־docs/design.md ("לוח טקטיקה") */
:root{
  --board:#1D4535; --board-2:#24533F; --board-dark:#173A2C;
  --chalk:#F2EFE6; --chalk-muted:#C5CFC3; --marker:#FFD23F; --on-marker:#1D2A12;
  --away:#F08A4B; --dash:2px dashed rgba(242,239,230,.55);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%;background:var(--board);color:var(--chalk);
  font-family:"Assistant",system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
body.has-tabs .app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.display{font-family:"Secular One",sans-serif;font-weight:400;margin:0}
h1{font-size:40px;line-height:1.08}
h2{font-size:28px;line-height:1.15}
h3{font-size:20px;line-height:1.2}
p{margin:0 0 10px}
.muted{color:var(--chalk-muted)}
.accent{color:var(--marker)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible,input:focus-visible,label:focus-within,a:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.primary{display:block;width:100%;min-height:56px;border:0;border-radius:4px;background:var(--marker);color:var(--on-marker);
  font-size:19px;font-weight:700;margin-top:16px}
.primary:disabled{opacity:.4;cursor:default}
.secondary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:var(--dash);border-radius:4px;background:transparent;
  font-size:17px;font-weight:600;margin-top:10px}
.card{border:var(--dash);border-radius:4px;background:var(--board-2);padding:14px 16px}
.section-gap{margin-top:18px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* סרגל תחתון */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--board-dark);border-top:1px solid rgba(242,239,230,.18);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:flex}
.tab{flex:1;min-height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--chalk-muted);font-size:13px;font-weight:600}
.tab[aria-current="page"]{color:var(--chalk);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--marker)}

/* מסך פתיחה (סמל) */
#s-splash{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#s-splash .logo{width:168px;height:168px;opacity:0;transform:scale(.85);animation:logoIn .6s .1s cubic-bezier(.2,1.4,.4,1) forwards}
#s-splash .logo .arrow{stroke-dasharray:7 7;stroke-dashoffset:120;animation:draw 1s .5s ease-out forwards}
#s-splash .word{font-family:"Secular One",sans-serif;font-size:52px;line-height:1;color:var(--marker);letter-spacing:2px;margin-top:14px;opacity:0;animation:fadeUp .5s .7s ease-out forwards}
#s-splash .tag{font-size:20px;font-weight:600;max-width:17em;text-wrap:balance;opacity:0;animation:fadeUp .5s .9s ease-out forwards}
#s-splash .primary{max-width:360px;margin-top:34px;opacity:0;animation:fadeUp .5s 1.1s ease-out forwards}
@keyframes logoIn{to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){#s-splash *{animation-duration:.01s !important;animation-delay:0s !important}}

/* פתיחה */
.steps{display:flex;gap:4px;margin:8px 0 22px}
.steps i{flex:1;height:5px;border-radius:2px;background:rgba(242,239,230,.2)}
.steps i.on{background:var(--marker)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choice{min-height:58px;border:var(--dash);border-radius:4px;background:var(--board-2);font-size:18px;font-weight:600;text-align:start;padding:10px 16px}
.choice[aria-pressed="true"]{background:var(--marker);color:var(--on-marker);border-color:var(--marker)}
.choices.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.field{width:100%;min-height:58px;margin-top:16px;border:var(--dash);border-radius:4px;background:var(--board-2);color:var(--chalk);
  font:inherit;font-size:20px;font-weight:600;padding:10px 16px}
.field::placeholder{color:rgba(242,239,230,.45)}
.back{background:none;border:0;color:var(--chalk-muted);min-height:44px;padding:0;font-size:15px}
.hero-pitch{display:block;width:100%;height:auto;margin:10px 0 18px}

/* בית */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge-streak{display:flex;align-items:center;gap:4px;padding:6px 12px 6px 10px;border:var(--dash);border-radius:4px;
  background:var(--board-2);font-family:"Secular One",sans-serif;font-size:26px;line-height:1;color:var(--marker);flex-shrink:0}
.badge-streak svg{display:block}
.daily{margin-top:18px;border:var(--dash);border-radius:4px;background:var(--board-2);padding:18px}
.daily .k{font-size:14px;font-weight:700;color:var(--chalk-muted)}
.daily .big{font-family:"Secular One",sans-serif;font-size:36px;line-height:1.1;margin:2px 0 4px}
.daily-in{display:flex;gap:14px;align-items:flex-start}
.daily-in > div{flex:1}
.week{display:flex;gap:6px;margin-top:10px}
.week i{flex:1;height:10px;border-radius:2px;background:rgba(242,239,230,.18)}
.week i.on{background:var(--marker)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.two .secondary{margin:0;min-height:64px;background:var(--board-2);font-size:15px}
.coach{margin-top:18px}
.coach .k{font-size:13px;font-weight:700;color:var(--chalk-muted);margin-bottom:4px}

/* מצבים */
.modes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;text-align:start;border:var(--dash);border-radius:4px;background:var(--board-2);padding:10px 14px}
.mode:disabled{opacity:.75;cursor:default}
.mode .ic{width:42px;height:42px;border-radius:4px;background:var(--board-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mode b{display:block;font-family:"Secular One",sans-serif;font-weight:400;font-size:19px;line-height:1.2}
.mode .sub{display:block;font-size:14px;color:var(--chalk-muted)}
.mode .go{margin-inline-start:auto;flex-shrink:0}
.tf-card{position:relative;overflow:hidden;touch-action:pan-y;margin:0 auto 10px}
.tf-claim{position:absolute;left:10px;right:10px;top:10px;text-align:center;background:rgba(10,24,18,.9);border:var(--dash);border-radius:4px;
  padding:8px 10px;font-family:"Secular One",sans-serif;font-size:20px;line-height:1.2;pointer-events:none}
.tf-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Secular One",sans-serif;font-size:96px;pointer-events:none;opacity:0}
.tf-flash.good{opacity:1;background:rgba(255,210,63,.22);color:var(--marker);animation:pop .2s ease-out}
.tf-flash.bad{opacity:1;background:rgba(10,24,18,.55);color:var(--chalk);animation:pop .2s ease-out}
.tf-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tf-btns button{min-height:64px;border-radius:4px;font-family:"Secular One",sans-serif;font-size:24px}
.tf-yes{background:var(--marker);color:var(--on-marker);border:0}
.tf-no{background:transparent;border:var(--dash);color:var(--chalk)}
.me-big{font-family:"Secular One",sans-serif;font-size:120px;line-height:1;color:var(--marker);margin:24px 0 0;font-variant-numeric:tabular-nums}
.record{display:inline-block;background:var(--marker);color:var(--on-marker);font-weight:700;border-radius:4px;padding:4px 12px;margin-top:10px}

/* בדיקה לאייל + שליחה */
.panel-card{margin-top:18px;border:2px solid var(--marker);border-radius:4px;background:var(--board-2);padding:16px}
.panel-card .k{font-size:13px;font-weight:700;color:var(--marker)}
.panel-card h3{margin:2px 0 4px}
.panel-card .bar{height:8px;border-radius:2px;background:rgba(242,239,230,.18);overflow:hidden;margin:10px 0 2px}
.panel-card .bar i{display:block;height:100%;background:var(--marker)}
.panel-card .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.panel-card .row2 .primary,.panel-card .row2 .secondary{margin-top:10px;min-height:50px;font-size:16px}
.disagree{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:10px;border:var(--dash);border-radius:4px;background:transparent;font-size:16px;font-weight:600}
.disagree[aria-pressed="true"]{background:var(--chalk);color:var(--board);border-color:var(--chalk)}
.note{width:100%;min-height:96px;margin-top:10px;border:var(--dash);border-radius:4px;background:var(--board-2);color:var(--chalk);font:inherit;padding:10px 12px;resize:vertical}
.preview-msg{white-space:pre-wrap;direction:rtl;font-size:13px;line-height:1.45;max-height:220px;overflow:auto;background:var(--board-dark);border-radius:4px;padding:10px 12px;margin-top:12px;color:var(--chalk-muted)}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}

/* התקדמות */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{border:var(--dash);border-radius:4px;background:var(--board-2);padding:12px 14px}
.tile .v{font-family:"Secular One",sans-serif;font-size:32px;line-height:1.1;color:var(--marker);font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;color:var(--chalk-muted)}
.chart{margin-top:18px}
.chart svg{display:block;width:100%;height:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:3px;background:rgba(242,239,230,.12)}
.cal i.on{background:var(--marker)}
.cal i.today{outline:2px solid var(--chalk);outline-offset:-2px}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;font-size:12px;color:var(--chalk-muted);text-align:center;margin-top:12px}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.sw .card .k{font-size:13px;font-weight:700;color:var(--chalk-muted)}
.sw .card .v{font-family:"Secular One",sans-serif;font-size:20px;line-height:1.2;margin-top:2px}
.empty{text-align:center;padding:28px 12px}

/* פרופיל */
.kv{display:flex;flex-direction:column;gap:0;margin-top:12px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,239,230,.14)}
.kv div span:first-child{color:var(--chalk-muted)}
.toggle{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600;border-bottom:1px solid rgba(242,239,230,.14)}
.toggle input{width:22px;height:22px;accent-color:var(--marker)}
.devnote{font-size:14px;color:var(--chalk-muted);margin-top:22px}

/* רשימת תרחישים (בדיקה) */
.group{margin-top:22px}
.group h3{margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:56px;text-align:start;
  border:var(--dash);border-radius:4px;background:var(--board-2);padding:10px 14px;font-size:16px;font-weight:600}
.badge{font-size:13px;font-weight:700;border-radius:4px;padding:2px 8px;background:var(--board-dark);color:var(--chalk-muted);white-space:nowrap}
.badge.mark{background:var(--marker);color:var(--on-marker)}

/* תרחיש */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:6px}
.x{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.stage{position:relative;margin:0 auto 8px;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:"Secular One",sans-serif;font-size:96px;color:var(--chalk);text-shadow:0 4px 24px rgba(0,0,0,.5)}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  background:var(--marker);color:var(--on-marker);font-weight:700;font-size:16px;padding:6px 14px;border-radius:4px}
.caption{position:absolute;left:12px;right:12px;top:12px;text-align:center;pointer-events:none;
  font-family:"Secular One",sans-serif;font-size:24px;line-height:1.2;padding:10px 12px;border-radius:4px;animation:pop .25s ease-out}
.caption.good{background:var(--marker);color:var(--on-marker)}
.caption.bad{background:rgba(10,24,18,.92);color:var(--chalk);border:var(--dash)}
.caption.neutral{background:var(--board-2);color:var(--chalk)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.timer{height:8px;background:var(--board-dark);border-radius:2px;overflow:hidden;margin:0 0 8px}
.timer>i{display:block;height:100%;width:100%;background:var(--marker)}
.timer.low>i{background:var(--chalk)}
.concealed{visibility:hidden}
.scan{display:block;width:100%;min-height:56px;border:var(--dash);border-radius:4px;background:transparent;font-size:18px;font-weight:700;margin:0 0 10px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.options button{min-height:46px;border:var(--dash);background:var(--board-2);border-radius:4px;font-size:15px;font-weight:600;padding:4px 8px;line-height:1.2}
.options button:active{background:var(--board-dark)}
.prompt{text-align:center;font-family:"Secular One",sans-serif;font-size:20px;color:var(--marker);min-height:44px;display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 10px;border-radius:4px;background:var(--board-dark);
  font-size:14px;font-weight:700;color:var(--chalk)}
.chip.mark{background:var(--marker);color:var(--on-marker)}
.chip.progress{margin-inline-start:auto;background:transparent;border:var(--dash);color:var(--chalk-muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:14px;border-radius:1px;background:rgba(242,239,230,.25)}
.dots i.on{background:var(--marker)}
.card.intro{margin:0 0 12px;font-size:18px;font-weight:600}
.freeze-tag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  background:rgba(10,24,18,.85);border:var(--dash);color:var(--chalk);font-size:14px;font-weight:700;padding:4px 12px;border-radius:4px}
.rules{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rules li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--chalk-muted)}
.rules b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:4px;
  background:var(--board-2);border:var(--dash);color:var(--marker);font-family:"Secular One",sans-serif;font-size:15px;font-weight:400}

/* חלון תוצאה */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,16,11,.5)}
.sheet{width:100%;max-width:520px;max-height:80vh;overflow:auto;background:var(--board-2);border-top:6px solid var(--marker);
  border-radius:8px 8px 0 0;padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
.sheet.bad{border-top-color:var(--chalk)}
.sheet h2{font-size:30px}
.stat{font-family:"Secular One",sans-serif;font-size:40px;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* סיכום */
.big-stat{font-family:"Secular One",sans-serif;font-size:64px;line-height:1;color:var(--marker);margin:18px 0 4px;font-variant-numeric:tabular-nums}
.cmp{display:flex;gap:10px;margin-top:14px}
.cmp .tile{flex:1}
.res-list{list-style:none;margin:0;padding:0}
.res-list li{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid rgba(242,239,230,.12);font-size:16px}
.res-list li:last-child{border-bottom:0}
.res-list .mk{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.res-list .mk.ok{background:var(--marker);color:var(--on-marker)}
.res-list .mk.no{border:var(--dash);color:var(--chalk)}
.res-list .tm{margin-inline-start:auto;color:var(--chalk-muted);font-variant-numeric:tabular-nums}

/* רצף — השתלטות על המסך */
.fx{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 42%, #2c6a50 0%, var(--board) 55%, #10291f 100%);text-align:center;padding:24px;overflow:hidden}
.fx-flame{width:120px;height:120px;transform:scale(.3);opacity:0}
.fx.play .fx-flame{animation:flameIn .5s .1s cubic-bezier(.2,1.6,.4,1) forwards, flicker 1.2s 1s ease-in-out infinite}
.odo{position:relative;height:190px;width:100%;overflow:hidden;margin-top:-6px}
.odo span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Secular One",sans-serif;font-size:170px;line-height:1;color:var(--marker);text-shadow:0 6px 30px rgba(255,210,63,.35)}
.odo .new{transform:translateY(100%)}
.fx.play .odo .old{animation:odoOut .55s 1.05s cubic-bezier(.6,0,.4,1) forwards}
.fx.play .odo .new{animation:odoIn .7s 1.05s cubic-bezier(.3,1.5,.5,1) forwards}
.fx-text{font-family:"Secular One",sans-serif;font-size:26px;margin:6px 0 0;opacity:0}
.fx-sub{color:var(--chalk-muted);margin:6px 0 0;opacity:0}
.fx.play .fx-text,.fx.play .fx-sub{animation:fadeUp .4s 1.7s ease-out forwards}
.fx .primary{max-width:340px;opacity:0}
.fx.play .primary{animation:fadeUp .4s 2.1s ease-out forwards}
.spark{position:absolute;left:50%;top:44%;width:8px;height:8px;border-radius:2px;background:var(--marker);opacity:0}
.fx.play .spark{animation:spark .9s 1.15s ease-out forwards}
@keyframes flameIn{to{transform:scale(1);opacity:1}}
@keyframes flicker{50%{transform:scale(1.06) rotate(-2deg)}}
@keyframes odoOut{to{transform:translateY(-100%);opacity:0}}
@keyframes odoIn{to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(200deg)}}
@media (prefers-reduced-motion: reduce){
  .sheet,.caption{animation:none}
  .fx.play .fx-flame,.fx.play .odo .old,.fx.play .odo .new,.fx.play .fx-text,.fx.play .fx-sub,.fx.play .primary,.fx.play .spark{animation-duration:.01s;animation-delay:0s}
}
.error{border:var(--dash);padding:14px;border-radius:4px;margin-top:20px}
</style>
</head>
<body>
<main class="app">

  <!-- ============ מסך פתיחה ============ -->
  <section id="s-splash" hidden>
    <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="Pressure">
      <rect x="3" y="3" width="114" height="114" rx="6" fill="#24533F" stroke="rgba(242,239,230,.6)" stroke-width="2.5" stroke-dasharray="8 6"/>
      <g fill="none" stroke="rgba(242,239,230,.35)" stroke-width="1.5"><line x1="10" y1="60" x2="110" y2="60"/><circle cx="60" cy="60" r="13"/></g>
      <path class="arrow" d="M38 86 C 48 58, 70 46, 88 36" fill="none" stroke="#FFD23F" stroke-width="4" stroke-linecap="round"/>

<script>
(function(){
"use strict";

var BASE = "../../content/";
var T = {};
function t(k, vars){
  var s = T[k] != null ? T[k] : k;
  if (vars) Object.keys(vars).forEach(function(v){ s = s.split("{" + v + "}").join(vars[v]); });
  return s;
}
var el = function(id){ return document.getElementById(id); };
function h(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// ---------- שמירה בדפדפן (אב טיפוס) ----------
var store = {
  get: function(k, def){ try { var v = JSON.parse(localStorage.getItem("pressure." + k)); return v == null ? def : v; } catch(e){ return def; } },
  set: function(k, v){ try { localStorage.setItem("pressure." + k, JSON.stringify(v)); } catch(e){} },
  clear: function(){ try { Object.keys(localStorage).forEach(function(k){ if (k.indexOf("pressure.") === 0) localStorage.removeItem(k); }); } catch(e){} }
};
var profile = null, settings = {fog:false, sound:true};

// ---------- תאריכים ----------
function dayKey(d){ d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function daysAgo(n){ var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() - n); return d; }
function today(){ return dayKey(); }
function yesterday(){ return dayKey(daysAgo(1)); }

// ---------- טעינה ----------
var index = [], queue = [], sc = null, sessionTotal = 0, session = null;

function getJSON(path){
  return fetch(BASE + path, {cache:"no-store"}).then(function(r){
    if (!r.ok) throw new Error(path + " (" + r.status + ")");
    return r.json();
  });
}

function boot(){
  Promise.all([getJSON("i18n/he.json"), getJSON("scenarios/index.json")]).then(function(res){
    T = res[0]; index = res[1].scenarios;
    profile = store.get("profile", null);
    settings = store.get("settings", {fog:false, sound:true});
    staticTexts();
    var direct = new URLSearchParams(location.search).get("s");
    if (direct){ startSession("single", [direct]); return; }
    if (new URLSearchParams(location.search).get("dev")){ nav("dev"); return; }
    nav("splash");
  }).catch(function(e){
    el("err").hidden = false;
    el("err").textContent = "לא הצלחתי לטעון את התרחישים: " + e.message + ". צריך להריץ דרך שרת מקומי.";
  });
}

function staticTexts(){
  document.querySelectorAll("[data-t]").forEach(function(n){ n.textContent = t(n.getAttribute("data-t")); });
  el("scanBtn").textContent = t("ui.scan");
  el("goBtn").textContent = t("ui.ready");
  el("hint").textContent = t("ui.hintScan");
  el("prompt").textContent = t("ui.markPrompt");
  el("closeBtn").setAttribute("aria-label", t("ui.close"));
  el("fxBtn").textContent = t("ui.continue");
  el("solBtn").textContent = t("ui.showSolution");
}

// ---------- ניווט ----------
var SCREENS = ["send","tf","modeEnd","splash","onboard","calibIntro","calibResult","waitlist","home","progress","profile","dev","play","summary","warmupDone","match"];
var TABBED = {home:1, progress:1, profile:1};
function nav(name){
  SCREENS.forEach(function(s){ el("s-" + s).hidden = s !== name; });
  var tabbed = !!TABBED[name];
  el("tabs").hidden = !tabbed;
  document.body.classList.toggle("has-tabs", tabbed);
  document.querySelectorAll(".tab").forEach(function(b){
    if (b.getAttribute("data-tab") === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  var r = RENDER[name]; if (r) r();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ nav(b.getAttribute("data-tab")); }); });

// ================= פתיחה: 5 שאלות =================
var OB = [
  {key:"name", type:"text"},
  {key:"pos", options:["CB","DM","FB","OTHER"]},
  {key:"level", options:["street","youth","academy"]},
  {key:"hard", options:["press","receiving","transition","cross","unknown"]},
  {key:"days", options:[3,4,5,7], grid:true}
];
var obStep = 0, obDraft = {};

function startOnboarding(){ obStep = 0; obDraft = profile ? JSON.parse(JSON.stringify(profile)) : {}; nav("onboard"); }

function renderOnboard(){
  var steps = el("obSteps"); steps.innerHTML = "";
  OB.forEach(function(_, i){ steps.appendChild(h("i", i <= obStep ? "on" : "")); });
  var q = OB[obStep], body = el("obBody"); body.innerHTML = "";
  if (obStep > 0){
    var back = h("button", "back", t("ob.back"));
    back.addEventListener("click", function(){ obStep--; renderOnboard(); });
    body.appendChild(back);
  } else {
    body.appendChild(h("p", "accent display", t("ob.hello"))).style.fontSize = "22px";
  }
  var title = h("h1", "", t("ob.q." + q.key));
  var titleId = "obQ"; title.id = titleId;

function pickDaily(){
  var att = attempts(), last = {};
  att.forEach(function(a){ last[a.id] = a; });
  var mine = index.filter(function(s){ return s.position === profile.pos; });
  var focus = store.get("focus", null);
  var wanted = focus ? [focus.tag] : (HARD_TAGS[profile.hard] || []);
  function score(s){
    var a = last[s.id], v = Math.random();
    if (a && !a.ok) v += 3;          // טעה בו — חוזרים אליו
    else if (!a) v += 2;             // עוד לא ראה
    if (s.tags && s.tags.some(function(tg){ return wanted.indexOf(tg) >= 0; })) v += 1.5;
    return v;
  }
  return mine.map(function(s){ return {id:s.id, v:score(s)}; })
    .sort(function(a,b){ return b.v - a.v; }).slice(0, DAILY_COUNT).map(function(x){ return x.id; });

  return shuffle(easy.slice()).slice(0, 3).map(function(s){ return s.id; });

function lineChart(pts){
  var NS = "http://www.w3.org/2000/svg", Wc = 320, Hc = 150, P = 26;
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + Wc + " " + Hc); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", t("pg.chartT"));
  var vals = pts.filter(function(p){ return p.v != null; }).map(function(p){ return p.v; });
  var lo = Math.max(0, Math.min.apply(null, vals.concat([1])) - 0.3), hi = Math.max.apply(null, vals.concat([2.5])) + 0.3;
  function x(i){ return P + i * (Wc - P - 8) / 13; }
  function y(v){ return 10 + (v - lo) / (hi - lo) * (Hc - 36); }   // מהיר = למעלה
  function add(tag, attrs){ var e = document.createElementNS(NS, tag); Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); }); svg.appendChild(e); return e; }
  [lo + 0.3, (lo + hi) / 2, hi - 0.3].forEach(function(v){
    add("line", {x1:P, x2:Wc - 8, y1:y(v), y2:y(v), stroke:"rgba(242,239,230,.15)", "stroke-dasharray":"3 4"});
    var tx = add("text", {x:P - 4, y:y(v) + 4, "text-anchor":"end", fill:"#C5CFC3", "font-size":"10"}); tx.textContent = v.toFixed(1);
  });
  var lab1 = add("text", {x:x(0), y:Hc - 6, fill:"#C5CFC3", "font-size":"10", "text-anchor":"middle"}); lab1.textContent = t("pg.twoWeeks");
  var lab2 = add("text", {x:x(13), y:Hc - 6, fill:"#C5CFC3", "font-size":"10", "text-anchor":"middle"}); lab2.textContent = t("pg.today");
  var d = "", first = true;
  pts.forEach(function(p){ if (p.v == null) return; d += (first ? "M" : "L") + x(p.i).toFixed(1) + " " + y(p.v).toFixed(1) + " "; first = false; });
  if (d) add("path", {d:d, fill:"none", stroke:"#FFD23F", "stroke-width":"2.5", "stroke-linejoin":"round"});
  pts.forEach(function(p){ if (p.v != null) add("circle", {cx:x(p.i), cy:y(p.v), r:"4", fill:"#FFD23F", stroke:"#1D4535", "stroke-width":"2"}); });
  return svg;
}

var tf = null, pool = null, tfTimer = 0, TF_MS = 30000;
function loadPool(){
  if (pool) return Promise.resolve(pool);
  return Promise.all(index.map(function(s){ return getJSON("scenarios/" + s.id + ".json"); })).then(function(a){ pool = a; return a; });
}
function startTF(){
  lastMode = "tf";
  loadPool().then(function(){
    tf = {score:0, total:0, end:performance.now() + TF_MS, lock:false, last:null};
    canvas = el("tfPitch"); ctx = canvas.getContext("2d");
    el("tfYes").textContent = t("tf.yes"); el("tfNo").textContent = t("tf.no"); el("tfHint").textContent = t("tf.hint");
    nav("tf");
    nextCard(); tfScore();
    clearInterval(tfTimer); tfTimer = setInterval(tfTick, 100);
  }).catch(function(e){ alert(e.message); });
}
function nextCard(){
  var cand = pool.filter(function(p){ return p.id !== tf.last; });
  sc = cand[Math.floor(Math.random() * cand.length)]; tf.last = sc.id;
  VT0 = VT = sc.view ? sc.view.top : 0.4; VB0 = VB = sc.view ? sc.view.bottom : 1.03;
  var truth = Math.random() < 0.5, opt;
  if (truth) opt = optionById(sc.correctOptionId);
  else { var wrong = sc.options.filter(function(o){ return o.id !== sc.correctOptionId; }); opt = wrong[Math.floor(Math.random() * wrong.length)]; }
  tf.opt = opt; tf.truth = truth;
  S = {phase:"tf", fog:false, choice:null};
  layout(el("tfCard"), 300);
  el("tfClaim").textContent = t(sc.type === "marking" ? "tf.claimMark" : "tf.claimPass", {x:t(opt.labelKey)});
  el("tfFlash").className = "tf-flash"; el("tfFlash").textContent = "";
  render(performance.now());
}
function tfScore(){ el("tfScore").textContent = t("tf.score", {n:tf.score}); }
function tfAnswer(saysTrue){
  if (!tf || tf.lock) return;
  tf.lock = true;
  var right = saysTrue === tf.truth;
  tf.total++; if (right) tf.score++;
  var f = el("tfFlash"); f.className = "tf-flash " + (right ? "good" : "bad"); f.textContent = right ? "\u2713" : "\u2717";
  tfScore();
  setTimeout(function(){ if (!tf) return; tf.lock = false; if (performance.now() < tf.end) nextCard(); }, 420);
}
function tfTick(){
  if (!tf) return;
  var left = tf.end - performance.now();
  el("tfBar").style.width = Math.max(0, left / TF_MS * 100) + "%";
  el("tfBar").parentNode.classList.toggle("low", left < 5000);
  if (left <= 0) endTF(true);
}
function endTF(finished){

var canvas = el("pitch"), ctx = canvas.getContext("2d");
var fog = document.createElement("canvas"), fctx = fog.getContext("2d");
var W = 0, H = 0, VT = 0.4, VB = 1.03, VT0 = 0.4, VB0 = 1.03, VL = 0, VR = 1, PX = 1, R0 = 11;

// אזור הפעולה: מה שחשוב להחלטה — אתה, הכדור, והשחקנים/הנקודות שאפשר לבחור
function actionBox(){
  var x0 = 1, x1 = 0;
  function add(p){ if (p.y < VT - 0.02 || p.y > VB + 0.02) return; x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); }
  ["me", "ball"].forEach(function(id){ var e = entity(id); if (e){ add(at(e.track, 0, id === "ball")); add(at(e.track, sc.freezeAtMs, id === "ball")); } });
  if (sc.type === "marking") (sc.candidates || []).forEach(function(id){ add(freezePos(id)); });
  else sc.options.forEach(function(o){
    if (typeof o.target === "string" && entity(o.target)) add(freezePos(o.target));
    else if (o.target && typeof o.target.x === "number") add({x:Math.max(0, Math.min(1, o.target.x)), y:o.target.y});
  });
  if (x1 < x0){ x0 = 0; x1 = 1; }
  return {x0:x0, x1:x1};
}

// המגרש ממלא את כל הרוחב ואת הגובה הפנוי. אם צריך — זום על אזור הפעולה.
function resize(){
  var reserved = S.phase === "preview" ? 330 : (sc.type === "marking" ? 162 : 220);
  layout(el("stage"), reserved + (S.fog ? 62 : 0));
}
function layout(st, reserved){
  VT = VT0; VB = VB0;
  var vw = Math.min(document.documentElement.clientWidth || 375, 560);
  var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  var availH = Math.max(220, vh - reserved);
  var spanY = VB - VT;
  var spanX = spanY * 105 * vw / (68 * availH);
  var box = actionBox();
  spanX = Math.min(1.04, Math.max(spanX, box.x1 - box.x0 + 0.14, 0.5));
  var cx = (box.x0 + box.x1) / 2;
  VL = cx - spanX / 2; VR = cx + spanX / 2;
  if (VL < -0.02){ VR += -0.02 - VL; VL = -0.02; }
  if (VR > 1.02){ VL -= VR - 1.02; VR = 1.02; }
  W = vw; H = Math.round(W * spanY * 105 / (spanX * 68));
  if (H > availH){ H = Math.round(availH); W = Math.round(H * spanX * 68 / (spanY * 105)); }
  PX = W / spanX;
  // נשאר מקום בגובה? מראים עוד מגרש מעל (באותו גודל), כדי שהמגרש ימלא את המסך
  if (H < availH - 4){
    var perY = PX * 105 / 68, extra = (availH - H) / perY;
    var up = Math.min(extra, Math.max(0, VT + 0.03));
    VT -= up; VB = Math.min(1.06, VB + (extra - up));
    H = Math.round((VB - VT) * perY);
  }
  R0 = Math.max(9, Math.min(18, PX * 0.028));
  st.style.width = W + "px";
  st.style.marginInline = "calc((100% - " + W + "px) / 2)";
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.height = H + "px";
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  fog.width = canvas.width; fog.height = canvas.height;
  ctx.setTransform(dpr,0,0,dpr,0,0); fctx.setTransform(dpr,0,0,dpr,0,0);
}
function X(x){ return (x - VL) * PX; }
function Y(y){ return (y - VT) / (VB - VT) * H; }

function at(track, time, linear){
  if (track.length === 1 || time <= track[0][0]) return {x:track[0][1], y:track[0][2]};
  for (var i = 1; i < track.length; i++){
    var a = track[i-1], b = track[i];
    if (time <= b[0]){
      var u = (time - a[0]) / (b[0] - a[0]);
      if (!linear) u = u * u * (3 - 2 * u);
      return {x:a[1] + (b[1]-a[1])*u, y:a[2] + (b[2]-a[2])*u};
    }
  }
  var l = track[track.length-1];
  return {x:l[1], y:l[2]};
}

function drawPitch(){
  ctx.fillStyle = "#24533F"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(242,239,230,.75)";
  ctx.lineWidth = Math.max(1.5, PX * 0.004);
  var r = 9.15 / 68 * PX;
  ctx.beginPath();
  ctx.moveTo(X(0.004), Y(0)); ctx.lineTo(X(0.004), Y(1));
  ctx.moveTo(X(0.996), Y(0)); ctx.lineTo(X(0.996), Y(1));
  ctx.moveTo(0, Y(1)); ctx.lineTo(W, Y(1));
  ctx.moveTo(0, Y(0.5)); ctx.lineTo(W, Y(0.5));
  ctx.stroke();
  ctx.beginPath(); ctx.arc(X(0.5), Y(0.5), r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeRect(X(0.2037), Y(0.8429), X(0.7963) - X(0.2037), Y(1) - Y(0.8429));
  ctx.strokeRect(X(0.3653), Y(0.9476), X(0.6347) - X(0.3653), Y(1) - Y(0.9476));
  ctx.strokeRect(X(0.4462), Y(1), X(0.5538) - X(0.4462), Y(1.02) - Y(1));
  ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
  ctx.strokeRect(X(0.2037), Y(0), X(0.7963) - X(0.2037), Y(0.1571) - Y(0));
  ctx.strokeRect(X(0.3653), Y(0), X(0.6347) - X(0.3653), Y(0.0524) - Y(0));
  ctx.strokeRect(X(0.4462), Y(-0.02), X(0.5538) - X(0.4462), Y(0) - Y(-0.02));
  ctx.fillStyle = "rgba(242,239,230,.75)";
  ctx.beginPath(); ctx.arc(X(0.5), Y(0.8952), ctx.lineWidth * 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(X(0.5), Y(0.1048), ctx.lineWidth * 1.3, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, Y(0.8429)); ctx.clip();
  ctx.beginPath(); ctx.arc(X(0.5), Y(0.8952), r, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, Y(0.1571), W, H); ctx.clip();
  ctx.beginPath(); ctx.arc(X(0.5), Y(0.1048), r, 0, Math.PI*2); ctx.stroke(); ctx.restore();
}

}

var FILL = {away:"#F08A4B", me:"#FFD23F", gk:"#9FD8CF", home:"#F2EFE6"};
function drawPlayer(p, team){
  var r = R0;
  ctx.beginPath(); ctx.arc(X(p.x), Y(p.y) + 2, r, 0, Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fill();
  ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r, 0, Math.PI*2);
  ctx.fillStyle = FILL[team] || FILL.home; ctx.fill();
  ctx.lineWidth = team === "me" ? 3 : 1.5;

  if (team === "me") label(t("ui.you"), X(p.x), Y(p.y) - r - 3, "#FFD23F");

function drawBall(p){

  ctx.fillStyle = "#FFFFFF"; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#111"; ctx.stroke();

function ring(p, color, pulse){

  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), R0 * (1.8 + pulse * 0.35), 0, Math.PI*2); ctx.stroke();

function targetPos(o){
  if (typeof o.target === "string") return freezePos(o.target);
  if (o.target && typeof o.target.x === "number") return {x:o.target.x, y:o.target.y};
  return freezePos("me");
}
function arrow(a, b, color){
  var x1 = X(a.x), y1 = Y(a.y), x2 = X(b.x), y2 = Y(b.y);
  var ang = Math.atan2(y2 - y1, x2 - x1), hl = R0 * 1.3;
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(3, R0 * 0.3); ctx.lineCap = "round";

  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(ang) * hl * 0.7, y2 - Math.sin(ang) * hl * 0.7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hl * Math.cos(ang - 0.45), y2 - hl * Math.sin(ang - 0.45));
  ctx.lineTo(x2 - hl * Math.cos(ang + 0.45), y2 - hl * Math.sin(ang + 0.45));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawFog(me, face, alpha){
  if (alpha <= 0.001) return;
  fctx.globalCompositeOperation = "source-over";
  fctx.clearRect(0, 0, W, H);
  fctx.fillStyle = "rgba(10,26,19,.94)"; fctx.fillRect(0, 0, W, H);
  fctx.globalCompositeOperation = "destination-out";
  var cx = X(me.x), cy = Y(me.y);
  var ang = Math.atan2(Y(face.y) - cy, X(face.x) - cx);
  var R = PX * 0.55, half = 55 * Math.PI / 180;
  var g = fctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(0.7, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
  fctx.fillStyle = g;
  fctx.beginPath(); fctx.moveTo(cx, cy); fctx.arc(cx, cy, R, ang - half, ang + half); fctx.closePath(); fctx.fill();
  fctx.beginPath(); fctx.arc(cx, cy, R0 * 3, 0, Math.PI*2); fctx.fill();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = alpha; ctx.drawImage(fog, 0, 0); ctx.restore();
}

var S = {}, raf = 0;
function stopLoop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
function entity(id){ for (var i = 0; i < sc.entities.length; i++) if (sc.entities[i].id === id) return sc.entities[i]; return null; }
function freezePos(id){ var e = entity(id); return e ? at(e.track, sc.freezeAtMs, id === "ball") : {x:0.5, y:0.5}; }

function posOf(id, now){
  var e = entity(id);
  if (S.phase === "countdown" || S.phase === "preview") return at(e.track, 0, id === "ball");
  if (S.phase === "run") return at(e.track, Math.min(sc.freezeAtMs, now - S.t0), id === "ball");
  if ((S.phase === "outcome" || S.phase === "after") && S.out && S.out.tracks && S.out.tracks[id]){
    var tt = S.phase === "after" ? S.out.durationMs : now - S.oStart;
    return at(S.out.tracks[id], tt, id === "ball");
  }
  return freezePos(id);
}

function reveal(now){
  var d = now - S.scanStart;
  if (d < 0) return 0;
  if (d < 100) return d / 100;
  if (d < 550) return 1;
  if (d < 700) return 1 - (d - 550) / 150;
  return 0;
}

function render(now){
  ctx.clearRect(0, 0, W, H);
  drawPitch();
  sc.entities.forEach(function(e){ if (e.id !== "ball") drawPlayer(posOf(e.id, now), e.team); });
  drawBall(posOf("ball", now));
  if (sc.type === "marking" && S.phase === "decide"){
    var pulse = (Math.sin(now / 180) + 1) / 2;
    sc.candidates.forEach(function(id){ ring(freezePos(id), "#FFD23F", pulse); });
  }
  if (sc.type === "marking" && (S.phase === "outcome" || S.phase === "after") && S.choice){
    ring(posOf(S.choice, now), S.choice === sc.correctOptionId ? "#FFD23F" : "#F2EFE6", 0);
  }
  if (S.phase === "tf" && tf && tf.opt){
    if (sc.type === "marking") ring(freezePos(tf.opt.entity || tf.opt.id), "#FFD23F", 0.3);
    else arrow(freezePos("me"), targetPos(tf.opt), "#FFD23F");
  }
  if (S.fog){
    var a = 1 - reveal(now);
    if (S.phase === "outcome" || S.phase === "after") a = Math.min(a, Math.max(0, 1 - (now - S.oStart) / 300));
    drawFog(posOf("me", now), posOf(sc.facing || "ball", now), a);
  }
}

function loop(now){
  if (S.phase === "countdown"){
    var n = 3 - Math.floor((now - S.cStart) / 700);
    if (n <= 0){ el("count").hidden = true; S.phase = "run"; S.t0 = now; }
    else el("count").textContent = n;
  }
  if (S.phase === "run" && now - S.t0 >= sc.freezeAtMs){
    S.phase = "decide"; S.dStart = now;
    el("timer").classList.remove("concealed");
    el(sc.type === "marking" ? "prompt" : "options").classList.remove("concealed");
  }
  if (S.phase === "decide"){
    var left = sc.decisionWindowMs - (now - S.dStart);
    var frac = Math.max(0, left / sc.decisionWindowMs);
    el("timerBar").style.width = (frac * 100) + "%";
    el("timer").classList.toggle("low", frac < 0.3);
    if (left <= 0) choose(null, now);
  }
  if (S.phase === "outcome" && now - S.oStart >= S.out.durationMs + 700){
    S.phase = "after";
    if (!S.solution) openSheet(); else el("sheetWrap").hidden = false;
  }
  el("hint").hidden = !(S.fog && S.scans === 0 && (S.phase === "run" || S.phase === "decide"));
  render(now);
  if (S.phase === "after"){ raf = 0; return; }
  raf = requestAnimationFrame(loop);
}

function setup(data){
  sc = data;
  VT0 = VT = sc.view ? sc.view.top : 0.4; VB0 = VB = sc.view ? sc.view.bottom : 1.03;
  S = {phase:"idle", fog:!!settings.fog, scans:0, scanStart:-1e9, choice:null, solution:false};
  var kind = session ? session.kind : "";
  if (kind === "survival") sc.decisionWindowMs = survivalWindow();
  if (kind === "weekly") sc.decisionWindowMs = 4000;
  el("pTitle").textContent = t(sc.id + ".title");
  el("pIntro").textContent = t(sc.id + ".intro");
  el("introBox").hidden = false; el("introFoot").hidden = false;
  ["timer","scanBtn","options","prompt","caption","count"].forEach(function(id){ el(id).hidden = true; });
  buildIntro();
  var box = el("options"); box.innerHTML = "";
  if (sc.type === "decision"){
    shuffle(sc.options.slice()).forEach(function(o){
      var b = h("button", "", t(o.labelKey));
      b.addEventListener("click", function(){ choose(o.id, performance.now()); });
      box.appendChild(b);
    });
  }
  nav("play");
  el("stage").hidden = false;
  S.phase = "preview";
  resize(); render(performance.now());
  el("freezeTag").hidden = false;
  if (kind === "survival") setTimeout(function(){ if (S.phase === "preview" && sc === data) startRun(); }, 1100);
}

function buildIntro(){
  var chips = el("chips"); chips.innerHTML = "";
  function chip(text, cls){ var c = h("span", "chip" + (cls ? " " + cls : ""), text); chips.appendChild(c); return c; }
  chip(t("pos." + sc.position));
  chip(t("type." + sc.type), sc.type === "marking" ? "mark" : "");
  var d = chip(t("ui.difficulty") + " ");
  var dots = h("span", "dots"); dots.setAttribute("aria-label", t("ui.diffAria", {n:sc.difficulty}));
  for (var i = 1; i <= 3; i++) dots.appendChild(h("i", i <= sc.difficulty ? "on" : ""));
  d.appendChild(dots);
  if (session && session.kind === "survival") chip(t("sv.chip", {n:session.results.length, s:(sc.decisionWindowMs / 1000).toFixed(1)}), "progress");
  else if (session && session.kind === "weekly") chip(t("wk.chip"), "mark");
  else if (sessionTotal > 1) chip(t("ui.progress", {n:sessionTotal - queue.length, total:sessionTotal}), "progress");
  el("freezeTag").textContent = t("ui.startPosition");
  var secs = (sc.decisionWindowMs / 1000).toString().replace(".0", "");
  var items = [["1", t("ui.rule1")], ["2", sc.type === "marking" ? t("ui.rule2mark") : t("ui.rule2", {s:secs})], ["3", S.fog ? t("ui.rule3fog") : t("ui.rule3")]];
  var ul = el("rules"); ul.innerHTML = "";
  items.forEach(function(it){ var li = h("li"); li.appendChild(h("b", "", it[0])); li.appendChild(h("span", "", it[1])); ul.appendChild(li); });
}

function startRun(){
  el("introBox").hidden = true; el("introFoot").hidden = true; el("freezeTag").hidden = true;
  el("timer").hidden = false; el("timer").classList.add("concealed");
  var ans = sc.type === "marking" ? "prompt" : "options";
  el(ans).hidden = false; el(ans).classList.add("concealed");
  el("scanBtn").hidden = !S.fog;
  S.phase = "countdown";
  if (session && session.kind === "weekly") store.set("weekly", {week:weekKey(), id:sc.id, ok:null});   // ניסיון אחד: נספר ברגע שמתחילים
  resize();
  el("timerBar").style.width = "100%";
  el("count").hidden = false; el("count").textContent = "3";
  S.phase = "countdown"; S.cStart = performance.now();
  stopLoop(); raf = requestAnimationFrame(loop);
}

function scan(){
  if (!S.fog || (S.phase !== "run" && S.phase !== "decide")) return;
  var now = performance.now();
  if (reveal(now) > 0) return;
  S.scanStart = now; S.scans++;
}

function optionById(id){ for (var i = 0; i < sc.options.length; i++) if (sc.options[i].id === id) return sc.options[i]; return null; }

function choose(id, now){
  if (S.phase !== "decide") return;
  S.choice = id; S.rt = id === null ? null : now - S.dStart;
  recordResult();
  if (session && session.kind === "weekly") store.set("weekly", {week:weekKey(), id:sc.id, ok:id === sc.correctOptionId, rt:S.rt});
  playOutcome(id === null ? sc.timeoutOutcome : optionById(id).outcome, now);
  ["timer","options","prompt","scanBtn","hint"].forEach(function(x){ el(x).hidden = true; });
}

function playOutcome(out, now){
  S.out = out; S.phase = "outcome"; S.oStart = now;
  var c = el("caption");
  c.className = "caption " + (out.kind || "neutral");
  c.textContent = (S.solution ? t("ui.solutionPrefix") : "") + t(out.captionKey);
  c.hidden = false;
  if (!raf) raf = requestAnimationFrame(loop);
}

function openSheet(){
  var ok = S.choice === sc.correctOptionId;
  el("sheet").classList.toggle("bad", !ok);
  el("rTitle").textContent = S.choice === null ? t("ui.timeout") : ok ? t("ui.correct") : t("ui.wrong");
  el("rTime").hidden = S.rt === null;
  el("rTime").textContent = S.rt === null ? "" : (S.rt / 1000).toFixed(1) + " " + t("ui.seconds");
  el("rScans").hidden = !S.fog;
  el("rScans").textContent = S.scans === 0 ? t("ui.noScan") : S.scans === 1 ? t("ui.scanOnce") : t("ui.scanMany", {n:S.scans});
  var chosen = S.choice ? optionById(S.choice) : null, right = optionById(sc.correctOptionId);
  el("rWhy").textContent = ok ? t(right.explainKey) : (chosen ? t(chosen.explainKey) + " " : "") + t(right.explainKey);
  el("nextBtn").textContent = queue.length ? t("ui.next") : t("ui.finish");
  el("solBtn").hidden = ok;
  var kind = session ? session.kind : "";
  if (kind === "survival" && !ok){ queue = []; el("nextBtn").textContent = t("sv.toEnd"); }
  if (kind === "weekly"){ el("rWhy").textContent = t("wk.hidden"); el("solBtn").hidden = true; }
  var dis = el("disBtn");
  dis.hidden = kind !== "panel";
  dis.setAttribute("aria-pressed", "false");
  dis.textContent = t("pn.disagree");
  el("sheetWrap").hidden = false;
  el("nextBtn").focus();
}

function showSolution(){
  el("sheetWrap").hidden = true; el("solBtn").hidden = true;
  S.solution = true;
  var right = optionById(sc.correctOptionId);
  if (sc.type === "marking") S.choice = right.id;
  playOutcome(right.outcome, performance.now());
}

// ================= רצף ימים =================
var DAILY_COUNT = 6;
function loadStreak(){
  var s = store.get("streak", null);
  if (!s || typeof s.count !== "number") s = {count:0, last:null};
  if (s.last && s.last !== today() && s.last !== yesterday()) s = {count:0, last:null};   // דילג על יום
  return s;
}
// מחזיר את המספר הקודם אם הרצף גדל היום, אחרת null
function completeDaily(){
  var s = loadStreak();
  if (s.last === today()) return null;
  var from = s.count;
  s.count += 1; s.last = today(); store.set("streak", s);
  return from;
}

var fxAfter = null;
function celebrate(from, to, after){
  fxAfter = after || null;
  el("fxOld").textContent = from;
  el("fxNew").textContent = to;
  el("fxText").textContent = to === 1 ? t("ui.streakFirst") : t("ui.streakText", {n:to});
  el("fxSub").textContent = t("ui.streakSub");
  var box = el("sparks"); box.innerHTML = "";
  for (var i = 0; i < 14; i++){
    var sp = h("span", "spark"), ang = (i / 14) * Math.PI * 2, dist = 120 + Math.random() * 90;
    sp.style.setProperty("--dx", Math.round(Math.cos(ang) * dist) + "px");
    sp.style.setProperty("--dy", Math.round(Math.sin(ang) * dist) + "px");
    box.appendChild(sp);
  }
  var fx = el("fx");
  fx.classList.remove("play"); fx.hidden = false;
  void fx.offsetWidth;
  fx.classList.add("play");
  if (settings.sound !== false) playStreakSound();
  setTimeout(function(){ el("fxBtn").focus(); }, 2200);
}
el("fxBtn").addEventListener("click", function(){
  el("fx").hidden = true; el("fx").classList.remove("play");
  var f = fxAfter; fxAfter = null; if (f) f();
});

function playStreakSound(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var a = new AC(), t0 = a.currentTime;
    var len = Math.floor(a.sampleRate * 0.45), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var n = a.createBufferSource(); n.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t0 + 0.6); f.frequency.exponentialRampToValueAtTime(2800, t0 + 1.05);
    var g = a.createGain(); g.gain.value = 0.22;
    n.connect(f); f.connect(g); g.connect(a.destination); n.start(t0 + 0.6);
    [784, 988, 1319].forEach(function(fr, k){
      var o = a.createOscillator(), gg = a.createGain(), st = t0 + 1.08 + k * 0.09;
      o.type = "triangle"; o.frequency.value = fr;
      gg.gain.setValueAtTime(0, st); gg.gain.linearRampToValueAtTime(0.28, st + 0.02);
      gg.gain.exponentialRampToValueAtTime(0.001, st + 0.7);
      o.connect(gg); gg.connect(a.destination); o.start(st); o.stop(st + 0.75);
    });
    setTimeout(function(){ try { a.close(); } catch(e){} }, 2500);
  } catch(e){}
}

function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return a;
}

canvas.addEventListener("pointerdown", function(ev){
  if (sc && sc.type === "marking" && S.phase === "decide"){
    var rect = canvas.getBoundingClientRect();
    var px = ev.clientX - rect.left, py = ev.clientY - rect.top, best = null, bestD = R0 * 3;
    sc.candidates.forEach(function(id){
      var p = freezePos(id), d = Math.hypot(X(p.x) - px, Y(p.y) - py);
      if (d < bestD){ bestD = d; best = id; }
    });
    if (best){ choose(best, performance.now()); return; }
  }
  scan();
});

el("goBtn").addEventListener("click", startRun);
el("scanBtn").addEventListener("click", scan);
el("nextBtn").addEventListener("click", next);
el("solBtn").addEventListener("click", showSolution);
el("closeBtn").addEventListener("click", quitSession);
window.addEventListener("resize", function(){ if (sc && !el("s-play").hidden && !el("stage").hidden){ resize(); render(performance.now()); } });

boot();
})();
</script>
